<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Copy And Move</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="btns-container">
                <button class="copyBtn btn">Copy Text</button>
            </div>
            <textarea name="copyText" rows="3" cols="50">Write...</textarea>
        </div>

        <div class="output-container">
            <div class="output"></div>
            <button class="moverBtn btn">Move Text</button>
            <textarea name="finalText" rows="3" cols="50"></textarea>
        </div>
        <script src="app.js"></script>
    </body>
</html>
