<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Images Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>Creative Images Effect Colection</h1>

        <!-- Images Effect 1 -->
        <div class="images-effect">
            <h2>Image Effect 1</h2>
            <div class="image-effect image-effect-1">
                <img src="./assets/photo1.jpg" alt="" class="img-1">
                <article class="article-1">
                    <h1 class="title-1">Welcome The Real World</h1>
                    <h4 class="sub-title-1">Write Your Content Here</h4>
                </article>
            </div>
        </div>

        <!-- Images Effect 2 -->
        <div class="images-effect">
            <h2>Image Effect 2</h2>
            <div class="image-effect image-effect-2">
                <img src="./assets/photo2.jpg" alt="" class="img-2">
                <article class="article-2">
                    <h1>Card Title</h1>
                    <h4>Content Goes Here</h4>
                </article>
            </div>
        </div>

        <!-- Images Effect 3 -->
        <div class="images-effect card">
            <h2>Image Effect 3</h2>
            <div class="image-effect image-effect-3">
                <div class="image-content">
                    <img src="./assets/photo3.jpg" alt="" class="img-3">
                </div>
                
                <section class="content">
                    <h3 class="title-3">Card Title</h3>
                    <p class="paragraf-3">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ut rem nesciunt illo veniam mollitia harum ea.
                    </p>
                    <a href="" class="link-3">Learn More</a>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
