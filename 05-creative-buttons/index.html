<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Buttons Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>Creative Buttons Collection</h1>
        
        <!-- Button 1 -->
        <section class="button-section">
            <h2>Button 1 - Slide Down Effect</h2>
            <div class="btn-container btn1-container">
                <a href="#" class="btn1">Hover Me</a>
            </div>
        </section>

        <!-- Button 2 -->
        <section class="button-section">
            <h2>Button 2 - 3D Flip Effect</h2>
            <div class="btn-container btn2-container">
                <a href="#" class="btn2">Hover Me</a>
            </div>
        </section>

        <!-- Button 3 -->
        <section class="button-section">
            <h2>Button 3 - Perspective Split</h2>
            <div class="btn-container btn3-container">
                <a href="#" class="btn3">Hover Me</a>
            </div>
        </section>

        <!-- Button 4 -->
        <section class="button-section">
            <h2>Button 4 - Corner Border</h2>
            <div class="btn-container btn4-container">
                <button class="btn4">Learn More</button>
            </div>
        </section>

        <!-- Button 5 -->
        <section class="button-section">
            <h2>Button 5 - Pulse Effect</h2>
            <div class="btn-container btn5-container">
                <a href="#" class="btn5">Hover Me</a>
            </div>
        </section>
    </div>
</body>
</html>
